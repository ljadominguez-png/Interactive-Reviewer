<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Operating Systems Reviewer</title>
  <link rel="stylesheet" href="style.css"/>
  <script src="intro_to_ai_lesson3.js"></script>
  <script src="os_data_lesson1_to_3.js"></script>
  <script src="PL_lesson3.js"></script>
  <script src="PL_lesson2.js"></script>
</head>

<body>

  <div class="container">
    <header>
      <h1>Operating Systems: Practice Reviewer</h1>
      <div class="subtitle" id="mode-hint">Type your answer, retry if needed, or reveal the answer.</div>
    </header>

    <div class="sticky-nav">
      <div class="nav-top-row">
        <div class="controls-left">
          <select id="subject-select" class="subject-select" onchange="onSubjectChange(this.value)"></select>
          <div class="toggle-group">
            <button class="toggle-btn active" id="btn-mode-ident" onclick="switchMode('identification')">Identification
              (Fill-in)</button>
            <button class="toggle-btn" id="btn-mode-mcq" onclick="switchMode('mcq')">Multiple Choice</button>
          </div>
        </div>
        <div style="display: flex; gap: 8px; align-items: center;">
          <button class="btn-theme" id="btn-theme" onclick="toggleDarkMode()" title="Toggle Theme">🌙</button>
          <button class="btn-reset" onclick="confirmReset()">Clear Progress</button>
        </div>
      </div>
      <div class="stats-row">
        <span id="score">Score: 0 / 110</span>
        <span id="progress">Progress: 0 / 110 completed</span>
      </div>
    </div>

    <div id="quiz-container"></div>
  </div>

  <script>
const stickyNav = document.querySelector('.sticky-nav');
let isTicking = false;
let userManuallyExpanded = false;
let expandScrollY = 0; // Tracks scroll offset when manually tapped

window.addEventListener('scroll', () => {
  if (!isTicking) {
    window.requestAnimationFrame(() => {
      const scrollY = window.scrollY;

      // Always reset and show fully near the very top
      if (scrollY < 80) {
        stickyNav.classList.remove('collapsed');
        userManuallyExpanded = false;
      } 
      // If user manually tapped expand, allow them to view controls until they scroll 80px away
      else if (userManuallyExpanded) {
        if (Math.abs(scrollY - expandScrollY) > 80) {
          userManuallyExpanded = false;
          stickyNav.classList.add('collapsed');
        }
      } 
      // Normal auto-collapse when scrolling down past the header
      else if (scrollY > 220) {
        stickyNav.classList.add('collapsed');
      }

      isTicking = false;
    });
    isTicking = true;
  }
}, { passive: true });

// Tap pill to expand
stickyNav.addEventListener('click', () => {
  if (stickyNav.classList.contains('collapsed')) {
    stickyNav.classList.remove('collapsed');
    userManuallyExpanded = true;
    expandScrollY = window.scrollY; // Store the exact position of the tap
  }
});

    const THEME_KEY = 'app_theme';

    function initTheme() {
      const savedTheme = localStorage.getItem(THEME_KEY);
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

      if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
        document.body.classList.add('dark-mode');
        document.getElementById('btn-theme').innerText = '☀️';
      } else {
        document.body.classList.remove('dark-mode');
        document.getElementById('btn-theme').innerText = '🌙';
      }
    }

    function toggleDarkMode() {
      const isDark = document.body.classList.toggle('dark-mode');
      localStorage.setItem(THEME_KEY, isDark ? 'dark' : 'light');
      document.getElementById('btn-theme').innerText = isDark ? '☀️' : '🌙';
    }
    initTheme();

    const registry = window.quizRegistry || {};
    const subjectKeys = Object.keys(registry);
    const MODE_KEY = 'active_mode';

    let currentSubjectKey = localStorage.getItem('active_subject') || subjectKeys[0] || '';
    if (!registry[currentSubjectKey] && subjectKeys.length > 0) {
      currentSubjectKey = subjectKeys[0];
    }

    let currentMode = localStorage.getItem(MODE_KEY) || 'identification';
    let quizData = registry[currentSubjectKey] ? registry[currentSubjectKey].data : [];
    let allAnswers = [...new Set(quizData.map(d => d.ans))];
    let userProgress = loadProgress();

    function getStorageKey() {
      return `progress_${currentSubjectKey}`;
    }

    function loadProgress() {
      try {
        const saved = localStorage.getItem(getStorageKey());
        return saved ? JSON.parse(saved) : {};
      } catch (e) {
        return {};
      }
    }

    function saveProgress() {
      try {
        localStorage.setItem(getStorageKey(), JSON.stringify(userProgress));
      } catch (e) { }
    }

    // 1. Populates the dropdown menu with all imported subjects
    function populateSubjectDropdown() {
      const select = document.getElementById('subject-select');
      select.innerHTML = '';
      subjectKeys.forEach(key => {
        const opt = document.createElement('option');
        opt.value = key;
        opt.innerText = registry[key].title || key.toUpperCase();
        if (key === currentSubjectKey) opt.selected = true;
        select.appendChild(opt);
      });
    }

    // 2. Handles switching subjects when the user picks one
    function onSubjectChange(newKey) {
      currentSubjectKey = newKey;
      localStorage.setItem('active_subject', newKey);
      quizData = registry[currentSubjectKey] ? registry[currentSubjectKey].data : [];
      allAnswers = [...new Set(quizData.map(d => d.ans))];
      userProgress = loadProgress();

      const header = document.querySelector('header h1');
      if (header && registry[currentSubjectKey]) {
        header.innerText = registry[currentSubjectKey].title;
      }
      renderQuiz();
    }

    function cleanString(str) {
      return str.toLowerCase()
        .replace(/[->→]/g, 'to')
        .replace(/[^a-z0-9]/g, '');
    }

    function seededShuffle(arr, seed) {
      const a = [...arr];
      let m = a.length, t, i;
      let s = seed;
      while (m) {
        s = (s * 9301 + 49297) % 233280;
        i = Math.floor((s / 233280) * m--);
        t = a[m];
        a[m] = a[i];
        a[i] = t;
      }
      return a;
    }

    function updateBanner() {
      let score = 0;
      let completed = 0;

      for (let i = 0; i < quizData.length; i++) {
        const state = userProgress[i];
        if (state && state.completed) {
          completed++;
          if (state.status === 'correct') {
            score++;
          }
        }
      }

      document.getElementById('score').innerText = `Score: ${score} / ${quizData.length}`;
      document.getElementById('progress').innerText = `Progress: ${completed} / ${quizData.length} completed`;
    }

    function switchMode(mode) {
      if (currentMode === mode) return;
      currentMode = mode;
      localStorage.setItem(MODE_KEY, mode);

      document.getElementById('btn-mode-ident').classList.toggle('active', mode === 'identification');
      document.getElementById('btn-mode-mcq').classList.toggle('active', mode === 'mcq');

      const hint = document.getElementById('mode-hint');
      if (mode === 'identification') {
        hint.innerText = "Type your answer, retry if needed, or reveal the answer.";
      } else {
        hint.innerText = "Select an option for instant feedback.";
      }

      renderQuiz();
    }

    function confirmReset() {
      const title = registry[currentSubjectKey]?.title || "this quiz";
      if (confirm(`Are you sure you want to clear your saved answers for ${title}?`)) {
        userProgress = {};
        saveProgress();
        updateBanner();
        renderQuiz();
      }
    }

    function renderQuiz() {
      const container = document.getElementById('quiz-container');
      container.innerHTML = '';
      let activeSection = '';

      quizData.forEach((item, index) => {
        if (item.sec !== activeSection) {
          activeSection = item.sec;
          const header = document.createElement('div');
          header.className = 'section-title';
          header.innerText = activeSection;
          container.appendChild(header);
        }

        const card = document.createElement('div');
        card.className = 'card';

        const qText = document.createElement('div');
        qText.className = 'question-text';
        qText.innerText = item.q;
        card.appendChild(qText);

        const feedback = document.createElement('div');
        feedback.className = 'feedback';

        const state = userProgress[index] || { completed: false, status: null, chosen: null };

        if (currentMode === 'identification') {
          const row = document.createElement('div');
          row.className = 'input-row';

          const input = document.createElement('input');
          input.type = 'text';
          input.placeholder = 'Type answer here...';

          const checkBtn = document.createElement('button');
          checkBtn.className = 'btn-check';
          checkBtn.innerText = 'Check';

          const revealBtn = document.createElement('button');
          revealBtn.className = 'btn-reveal';
          revealBtn.innerText = 'Reveal';

          if (state.completed) {
            input.disabled = true;
            checkBtn.disabled = true;
            revealBtn.disabled = true;

            if (state.status === 'correct') {
              input.value = state.chosen || item.ans;
              card.className = 'card correct-card';
              feedback.className = 'feedback correct';
              feedback.innerHTML = `✓ Correct! <div class="correct-answer-display">Answer: <strong>${item.ans}</strong></div>`;
            } else {
              card.className = 'card revealed-card';
              feedback.className = 'feedback revealed';
              feedback.innerHTML = `Answer revealed: <div class="correct-answer-display"><strong>${item.ans}</strong></div>`;
            }
          }

          function handleCheck() {
            if (state.completed) return;
            const userVal = input.value.trim();
            if (!userVal) return;

            const userClean = cleanString(userVal);
            const validAnswers = [item.ans, ...(item.alt || [])];
            const isCorrect = validAnswers.some(ans => cleanString(ans) === userClean);

            if (isCorrect) {
              userProgress[index] = { completed: true, status: 'correct', chosen: userVal };
              saveProgress();

              input.disabled = true;
              checkBtn.disabled = true;
              revealBtn.disabled = true;

              card.className = 'card correct-card';
              feedback.className = 'feedback correct';
              feedback.innerHTML = `✓ Correct! <div class="correct-answer-display">Answer: <strong>${item.ans}</strong></div>`;

              updateBanner();
            } else {
              card.className = 'card try-again-card';
              feedback.className = 'feedback try-again';
              feedback.innerText = '✗ Not quite. Try again, or click Reveal if stuck!';

              input.classList.remove('shake');
              void input.offsetWidth;
              input.classList.add('shake');
              input.focus();
            }
          }

          function handleReveal() {
            if (state.completed) return;
            userProgress[index] = { completed: true, status: 'revealed', chosen: null };
            saveProgress();

            input.disabled = true;
            checkBtn.disabled = true;
            revealBtn.disabled = true;

            card.className = 'card revealed-card';
            feedback.className = 'feedback revealed';
            feedback.innerHTML = `Answer revealed: <div class="correct-answer-display"><strong>${item.ans}</strong></div>`;

            updateBanner();
          }

          checkBtn.onclick = handleCheck;
          revealBtn.onclick = handleReveal;

          input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
              e.preventDefault();
              handleCheck();
            }
          });

          row.appendChild(input);
          row.appendChild(checkBtn);
          row.appendChild(revealBtn);
          card.appendChild(row);

        } else {
          const distractors = seededShuffle(allAnswers.filter(a => a !== item.ans), index * 31 + 7).slice(0, 3);
          const choices = seededShuffle([item.ans, ...distractors], index * 17 + 3);

          const grid = document.createElement('div');
          grid.className = 'options-grid';
          const buttons = [];

          choices.forEach(choice => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = choice;

            if (state.completed) {
              btn.disabled = true;
              if (choice === item.ans) {
                btn.classList.add('correct');
              }
              if (state.status === 'wrong' && state.chosen === choice) {
                btn.classList.add('wrong');
              }
            }

            btn.onclick = () => {
              if (state.completed) return;
              const isRight = (choice === item.ans);
              userProgress[index] = { completed: true, status: isRight ? 'correct' : 'wrong', chosen: choice };
              saveProgress();

              buttons.forEach(b => b.disabled = true);

              if (isRight) {
                card.className = 'card correct-card';
                btn.classList.add('correct');
                feedback.className = 'feedback correct';
                feedback.innerHTML = `✓ Correct!`;
              } else {
                card.className = 'card wrong-card';
                btn.classList.add('wrong');
                const correctBtn = buttons.find(b => b.innerText === item.ans);
                if (correctBtn) correctBtn.classList.add('correct');
                feedback.className = 'feedback wrong';
                feedback.innerHTML = `✗ Incorrect. Correct: <strong>${item.ans}</strong>`;
              }

              updateBanner();
            };

            buttons.push(btn);
            grid.appendChild(btn);
          });

          if (state.completed) {
            if (state.status === 'correct') {
              card.className = 'card correct-card';
              feedback.className = 'feedback correct';
              feedback.innerHTML = `✓ Correct!`;
            } else {
              card.className = 'card wrong-card';
              feedback.className = 'feedback wrong';
              feedback.innerHTML = `✗ ${state.status === 'revealed' ? 'Revealed' : 'Incorrect'}. Correct: <strong>${item.ans}</strong>`;
            }
          }

          card.appendChild(grid);
        }

        card.appendChild(feedback);
        container.appendChild(card);
      });

      updateBanner();
    }

    // 3. Initialize Everything
    populateSubjectDropdown();
    if (registry[currentSubjectKey]) {
      const header = document.querySelector('header h1');
      if (header) header.innerText = registry[currentSubjectKey].title;
    }
    document.getElementById('btn-mode-ident').classList.toggle('active', currentMode === 'identification');
    document.getElementById('btn-mode-mcq').classList.toggle('active', currentMode === 'mcq');
    renderQuiz();
  </script>
</body>

</html>
